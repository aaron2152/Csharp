<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8"/>
		<title>Catálogo</title>
		<!-- enlace a Bootstrap -->
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"/>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
	</head>
	<body class="bg-light p-4">
		<div class="container my-4" style="max-width: 700px;">
			<h1 class="text-primary mb-4 text-center fw-bold">Catálogo del kiosco</h1>

			<div class="table-responsive shadow-sm rounded mb-4">
				<table class="table table-striped table-hover align-middle mb-0">
					<thead class="table-dark">
						<tr>
							<th>Producto</th>
							<th>Precio</th>
						</tr>
					</thead>
					<tbody>
						<tr>
							<td>Gaseosa 500 ml</td>
							<td class="fw-semibold">6.000 Gs</td>
						</tr>
						<tr>
							<td>Alfajor</td>
							<td class="fw-semibold">3.500 Gs</td>
						</tr>
					</tbody>
				</table>
			</div>

			<div class="card border-warning bg-warning-subtle mb-4 shadow-sm">
				<div class="card-body">
					<h5 class="card-title text-warning-emphasis fw-bold">Oferta del día</h5>
					<p class="card-text text-warning-emphasis mb-0">Alfajor a 3.000 Gs hasta las 18:00.</p>
				</div>
			</div>

			<div class="d-grid gap-2">
				<button class="btn btn-primary btn-lg shadow-sm">Agregar producto</button>
			</div>
		</div>
	</body>
</html>
